# Register @lebxdbot webhook on the t2t-box Worker.
# Does not change the tg2tmbot webhook.
name: Set webhook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webhook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Require WEBHOOK_SECRET
        run: |
          if [ -z "${{ secrets.WEBHOOK_SECRET }}" ]; then
            echo "::error::Repository secret WEBHOOK_SECRET is not set. Add a new value for @lebxdbot (same value as on worker t2t-box) before running this workflow."
            exit 1
          fi
      - name: Install worker dependencies
        working-directory: worker
        run: npm ci
      - name: setWebhook on Worker URL
        working-directory: worker
        run: npm run set-webhook
        env:
          CONFIRM_STOP_POLLING: "1"
          LEBXDBOT_TOKEN: ${{ secrets.LEBXDBOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          LEBXD_WEBHOOK_URL: https://t2t-box.prtndz.workers.dev/telegram
