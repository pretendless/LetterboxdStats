# @lebxdbot /start → Letterboxd ZIP from Telegram file_id → Python charts → send PNGs.
# Secrets: LEBXDBOT_TOKEN, TMDB_BEARER_TOKEN (Read Access Token). Do not print tokens.
# Do not use TG2TMBOT_TOKEN here.
name: Letterboxd

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Job id from Worker KV (lb-…)
        required: true
        type: string
      chat_id:
        description: Telegram chat id to reply to
        required: true
        type: string
      file_id:
        description: Telegram document file_id of the Letterboxd export ZIP
        required: true
        type: string
      top_n:
        description: Positions in ranking charts (1–100; default 20; figure grows taller with N)
        required: false
        default: "20"
        type: string
      min_rated:
        description: Rating-count threshold for average tops (1–50)
        required: false
        default: "4"
        type: string
      include_rewatch_in_averages:
        description: Count each rated diary row (incl. rewatches) in average charts (true/false; default false = one rating per film)
        required: false
        default: "false"
        type: string
      show_likes:
        description: Show liked hearts (♥) on charts and search lists (true/false; default true)
        required: false
        default: "true"
        type: string
      show_reviews:
        description: Show review marks (≡) on charts and search lists (true/false; default true)
        required: false
        default: "true"
        type: string
      show_top_review:
        description: In-plot top-review panel on ranking charts (true/false; default true); also emits lower-rating charts when on
        required: false
        default: "true"
        type: string
      rating_scale:
        description: Display scale for rating/average numbers (5, 10, or 100; default 10). Internal values stay 0.5–5.
        required: false
        default: "10"
        type: string
      include_usa:
        description: Include USA in country tops (true/false)
        required: false
        default: "true"
        type: string
      include_english:
        description: Include English (en) in language tops (true/false)
        required: false
        default: "true"
        type: string
      include_drama:
        description: Include Drama in genre charts (true/false)
        required: false
        default: "true"
        type: string
      include_comedy:
        description: Include Comedy in genre charts (true/false)
        required: false
        default: "true"
        type: string
      exclude_keywords:
        description: Comma-separated keywords to drop from watch-count tops (label substring match)
        required: false
        default: ""
        type: string
      search_keywords:
        description: Comma-separated search keywords — film lists after charts (metadata substring match)
        required: false
        default: ""
        type: string
      date_from:
        description: Inclusive watch-date start YYYY-MM-DD (empty = full span)
        required: false
        default: ""
        type: string
      date_to:
        description: Inclusive watch-date end YYYY-MM-DD (empty = full span)
        required: false
        default: ""
        type: string
      include_undated:
        description: Custom range only — also include watched/ratings films with no diary date (true/false)
        required: false
        default: "false"
        type: string

permissions:
  contents: read

jobs:
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install -r scripts/requirements-letterboxd.txt
      - name: Build charts and send to Telegram
        env:
          LEBXDBOT_TOKEN: ${{ secrets.LEBXDBOT_TOKEN }}
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
          FILE_ID: ${{ inputs.file_id }}
          JOB_ID: ${{ inputs.job_id }}
          LETTERBOXD_TOP_N: ${{ inputs.top_n }}
          LETTERBOXD_MIN_RATED: ${{ inputs.min_rated }}
          LETTERBOXD_INCLUDE_REWATCH_IN_AVERAGES: ${{ inputs.include_rewatch_in_averages }}
          LETTERBOXD_SHOW_LIKES: ${{ inputs.show_likes }}
          LETTERBOXD_SHOW_REVIEWS: ${{ inputs.show_reviews }}
          LETTERBOXD_SHOW_TOP_REVIEW: ${{ inputs.show_top_review }}
          LETTERBOXD_RATING_SCALE: ${{ inputs.rating_scale }}
          LETTERBOXD_INCLUDE_USA: ${{ inputs.include_usa }}
          LETTERBOXD_INCLUDE_ENGLISH: ${{ inputs.include_english }}
          LETTERBOXD_INCLUDE_DRAMA: ${{ inputs.include_drama }}
          LETTERBOXD_INCLUDE_COMEDY: ${{ inputs.include_comedy }}
          LETTERBOXD_EXCLUDE_KEYWORDS: ${{ inputs.exclude_keywords }}
          LETTERBOXD_SEARCH_KEYWORDS: ${{ inputs.search_keywords }}
          LETTERBOXD_DATE_FROM: ${{ inputs.date_from }}
          LETTERBOXD_DATE_TO: ${{ inputs.date_to }}
          LETTERBOXD_INCLUDE_UNDATED: ${{ inputs.include_undated }}
          MPLBACKEND: Agg
        run: node scripts/letterboxd_genres_run.mjs
